[workspace]
resolver = "3"
members = ["proto", "server", "client", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
vwf-proto = { path = "proto" }
vwf-server = { path = "server" }
vwf-client = { path = "client" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
if-addrs = "0.15"
nnnoiseless = { version = "0.5", default-features = false }
nnoiseless = { version = "0.5", default-features = false }
opus = "0.4"
postcard = { version = "1", features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
ringbuf = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = false

# Шумодав и БПФ считаются на каждом аудиокадре. Без оптимизаций они в десятки
# раз медленнее, и в отладочной сборке (`cargo run`) звук начал бы прерываться.
[profile.dev.package.nnnoiseless]
opt-level = 3
[profile.dev.package.easyfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
