[package]
name = "vwf-client"
description = "Клиент voice_with_friends: звук, кодек, сеть"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "poigrulkiny-cli"
path = "src/main.rs"

[dependencies]
vwf-proto.workspace = true
vwf-nat.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
cpal.workspace = true
if-addrs.workspace = true
nnnoiseless.workspace = true
opus.workspace = true
quinn.workspace = true
ringbuf.workspace = true
rustls.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
# Демонстрация экрана: кодек H.264 (собирается из исходников OpenH264)
# и JPEG для показа кадров в окне программы.
openh264 = "0.9"
# Приоритеты потоков: звук — выше обычного, демонстрация экрана — ниже.
thread-priority = "3"
jpeg-encoder = "0.7"

# Захват экрана. На Windows — xcap (DXGI для мониторов, GDI для окон).
# В Linux xcap требует PipeWire, а нам Linux нужен только для проверок,
# поэтому там свой простой захват через X11.
# Эхоподавление (WebRTC AEC3). На Android эхо убирает сам телефон в режиме
# звонка, поэтому там он не нужен.
[target.'cfg(not(target_os = "android"))'.dependencies]
sonora.workspace = true

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# Android: звук напрямую через AAudio в режиме звонка (src/aaudio.rs).
# api-level-28 — для режима «разговор» у микрофона (Android 9+).
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }

[dev-dependencies]
vwf-server.workspace = true
